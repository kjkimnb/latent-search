[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-search"
version = "0.1.0"
description = "Language-conditioned progress learning and latent world-model planning for manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "PyYAML>=6.0",
  "h5py>=3.10",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["latent_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
